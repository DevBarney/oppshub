<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>OppsHub — OFY + OppDesk</title>
<style>
:root{--bg:#070b14;--card:#111827;--border:#1f2937;--text:#e5e7eb;--muted:#9ca3af;--faint:#6b7280;--accent:#38bdf8;--accent2:#a78bfa;--ok:#86efac;--danger:#fca5a5}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.45}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;font-weight:800;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{color:var(--muted);font-size:.85rem;margin:4px 0 14px}
.panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:16px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:800px){.filters{grid-template-columns:2fr 1fr 1fr 1fr}}
label{display:block;font-size:.72rem;font-weight:600;color:var(--muted);margin-bottom:4px}
input,select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:#070b14;color:var(--text);font-size:.95rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:.75rem;padding:5px 10px;border-radius:999px;background:#1f2937;color:var(--muted);cursor:pointer;border:1px solid transparent}
.chip.active{background:#0c4a6e;color:#7dd3fc;border-color:var(--accent)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
button{border:none;border-radius:10px;padding:10px 14px;font-weight:700;font-size:.9rem;cursor:pointer;background:var(--accent);color:#0c0a09}
button.secondary{background:#1f2937;color:var(--text)}
button.purple{background:var(--accent2);color:#0c0a09}
.stats{font-size:.82rem;color:var(--muted);margin:8px 0 12px}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:700px){.grid{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.title{font-size:.95rem;font-weight:700;line-height:1.3}
.meta{font-size:.75rem;color:var(--muted)}
.badge{display:inline-block;font-size:.68rem;padding:2px 8px;border-radius:999px;margin-right:4px}
.badge.ofy{background:#4c1d95;color:#ddd6fe}
.badge.od{background:#0c4a6e;color:#bae6fd}
.badge.sec{background:#1f2937;color:var(--faint)}
.excerpt{font-size:.78rem;color:var(--faint)}
.links a{display:block;text-align:center;text-decoration:none;font-size:.8rem;font-weight:700;padding:9px;border-radius:8px;background:var(--accent);color:#0c0a09;margin-top:6px}
.links a.disabled{background:#374151;pointer-events:none}
.status{margin-top:10px;padding:10px;border-radius:10px;font-size:.85rem;display:none}
.status.show{display:block}
.status.ok{background:#14532d;color:var(--ok)}
.status.err{background:#450a0a;color:var(--danger)}
.status.info{background:#0c1929;border:1px solid var(--border);color:var(--muted)}
.empty{text-align:center;color:var(--faint);padding:40px 10px}
.note{font-size:.75rem;color:var(--faint);margin-top:14px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <h1>OppsHub</h1>
  <p class="sub">OFY + Opportunity Desk · official application links · CSV export</p>
  <div class="panel">
    <div class="filters">
      <div><label>Search</label><input id="search" placeholder="nursing, africa, STEM..."/></div>
      <div><label>Source</label>
        <select id="source">
          <option value="">All sources</option>
          <option value="OFY">OFY (Opportunities for Youth)</option>
          <option value="OppDesk">OppDesk (Opportunity Desk)</option>
        </select>
      </div>
      <div><label>Section</label>
        <select id="section"><option value="">All sections</option></select>
      </div>
      <div><label>Show</label>
        <select id="limit">
          <option value="24">24</option>
          <option value="48" selected>48</option>
          <option value="96">96</option>
          <option value="all">All matched</option>
        </select>
      </div>
    </div>
    <div class="chips">
      <span class="chip active" data-source="" data-q="">All</span>
      <span class="chip" data-source="OFY" data-q="">OFY</span>
      <span class="chip" data-source="OppDesk" data-q="">OppDesk</span>
      <span class="chip" data-source="" data-q="nursing">Nursing</span>
      <span class="chip" data-source="" data-q="nigeria">Nigeria</span>
      <span class="chip" data-source="" data-q="africa">Africa</span>
      <span class="chip" data-source="" data-q="scholarship">Scholarship</span>
    </div>
    <div class="actions">
      <button onclick="render()">Apply filters</button>
      <button class="secondary" onclick="exportCsv()">Download CSV</button>
      <button class="purple" onclick="exportCsv(true)">Download all CSV</button>
      <button class="secondary" onclick="copyLinks()">Copy apply links</button>
    </div>
    <div id="status" class="status"></div>
  </div>
  <p class="stats" id="stats">Loading...</p>
  <div class="grid" id="grid"></div>
  <p class="note">CSV: id, title, application_url, date, section, source, excerpt · No article-page URLs</p>
</div>
<script>
let ALL = [];
function $(id){return document.getElementById(id)}
function setStatus(msg,type){const el=$("status");el.textContent=msg||"";el.className="status"+(msg?" show "+type:"")}
function esc(v){v=(v==null?"":String(v)).replace(/"/g,'""');return /[",\n]/.test(v)?'"'+v+'"':v}
function filtered(){
  const q=($("search").value||"").trim().toLowerCase();
  const source=$("source").value;
  const section=$("section").value;
  let list=ALL;
  if(source) list=list.filter(i=>i.source===source);
  if(section) list=list.filter(i=>i.section===section);
  if(q) list=list.filter(i=>[i.title,i.excerpt,i.section,i.source].join(" ").toLowerCase().includes(q));
  return list;
}
function fillSections(){
  const source=$("source").value;
  const set=new Set();
  ALL.forEach(i=>{if(!source||i.source===source) set.add(i.section)});
  const cur=$("section").value;
  $("section").innerHTML='<option value="">All sections</option>'+
    [...set].sort().map(s=>`<option value="${s}">${s}</option>`).join("");
  if([...set].includes(cur)) $("section").value=cur;
}
function cardHtml(c){
  const href=c.url||"";
  const badge=c.source==="OFY"?'<span class="badge ofy">OFY</span>':'<span class="badge od">OppDesk</span>';
  const btn=href
    ?`<a href="${href}" target="_blank" rel="noopener">Open application</a>`
    :`<a class="disabled" href="#">No apply link found</a>`;
  return `<article class="card">
    <div class="title">${c.title||"Untitled"}</div>
    <div class="meta">${badge}<span class="badge sec">${c.section||""}</span> ${c.date||""}</div>
    <div class="excerpt">${c.excerpt||""}</div>
    <div class="links">${btn}</div>
  </article>`;
}
function render(){
  fillSections();
  let list=filtered();
  const lim=$("limit").value;
  const shown=lim==="all"?list:list.slice(0,parseInt(lim,10));
  $("grid").innerHTML=shown.length?shown.map(cardHtml).join(""):`<div class="empty">No matches.</div>`;
  $("stats").textContent=`Showing ${shown.length} of ${list.length} matched · ${ALL.length} total (OFY + OppDesk)`;
}
function exportCsv(all=false){
  const list=all?ALL.slice():filtered();
  if(!list.length) return setStatus("Nothing to export.","err");
  const headers=["id","title","application_url","date","section","source","excerpt"];
  const lines=[headers.join(",")].concat(list.map(c=>[
    esc(c.id),esc(c.title),esc(c.url||""),esc(c.date),esc(c.section),esc(c.source),esc(c.excerpt)
  ].join(",")));
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([lines.join("\n")],{type:"text/csv;charset=utf-8;"}));
  a.download=`oppshub_${all?"all":"filtered"}_${list.length}.csv`;
  a.click();
  setStatus("Downloaded "+list.length+" rows (application_url only).","ok");
}
async function copyLinks(){
  const links=filtered().map(i=>i.url).filter(Boolean);
  if(!links.length) return setStatus("No application links.","err");
  try{await navigator.clipboard.writeText(links.join("\n"));setStatus("Copied "+links.length+" application links.","ok")}
  catch{setStatus("Clipboard blocked — use Download CSV.","err")}
}
document.querySelectorAll(".chip").forEach(chip=>{
  chip.addEventListener("click",()=>{
    document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
    chip.classList.add("active");
    $("source").value=chip.getAttribute("data-source")||"";
    $("search").value=chip.getAttribute("data-q")||"";
    render();
  });
});
$("search").addEventListener("keydown",e=>{if(e.key==="Enter")render()});
["source","section","limit"].forEach(id=>$(id).addEventListener("change",render));
(async function(){
  setStatus("Loading OFY + OppDesk...","info");
  try{
    const base="https://raw.githubusercontent.com/DevBarney/oppshub/main/data/";
    const [ofy,od]=await Promise.all([
      fetch(base+"ofy.json?t="+Date.now()).then(r=>{if(!r.ok)throw new Error("ofy "+r.status);return r.json()}),
      fetch(base+"oppdesk.json?t="+Date.now()).then(r=>{if(!r.ok)throw new Error("oppdesk "+r.status);return r.json()}),
    ]);
    ALL=[...ofy,...od].sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    setStatus("Loaded "+ALL.length+" opportunities.","ok");
    render();
  }catch(e){setStatus("Failed: "+e.message,"err")}
})();
</script>
</body>
</html>
